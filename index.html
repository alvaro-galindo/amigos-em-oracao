<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#6C3FC5" />
  <meta name="description" content="Dos Amigos em Oração — pedidos, intercessão e reavivamento" />
  <title>Dos Amigos em Oração 🙏</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Ícone de oração como favicon via SVG emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙏</text></svg>" />
</head>
<body>

  <!-- Loading overlay -->
  <div id="loading-overlay" style="display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#4A2A8A,#6C3FC5);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:16px">
    <div style="font-size:3rem;animation:pulse 1.5s infinite">🙏</div>
    <div style="color:#fff;font-size:1rem;font-weight:700">Carregando...</div>
    <div style="color:rgba(255,255,255,0.7);font-size:0.8rem">Dos Amigos em Oração</div>
  </div>

  <!-- ======================================================
       HERO
  ====================================================== -->
  <header class="hero">
    <span class="hero-emoji">🙏</span>
    <h1 id="h-titulo">DOS AMIGOS EM ORAÇÃO</h1>
    <div class="hero-sub" id="h-subtitulo">PAZ SEJA CONVOSCO 🔥</div>
    <div class="hero-data" id="h-data">📅 30/08/2026</div>
    <div class="hero-lema" id="h-lema"></div>
  </header>

  <!-- ======================================================
       ABAS DE NAVEGAÇÃO
  ====================================================== -->
  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="pedidos"   role="tab" aria-selected="true" >🙏 Pedidos</button>
    <button class="tab-btn"        data-tab="motivos"   role="tab" aria-selected="false">📋 Motivos</button>
    <button class="tab-btn"        data-tab="lista"     role="tab" aria-selected="false">👥 Lista</button>
    <button class="tab-btn"        data-tab="mensagem"  role="tab" aria-selected="false">📲 Mensagem</button>
  </nav>

  <!-- ======================================================
       CONTEÚDO PRINCIPAL
  ====================================================== -->
  <main class="main-content">

    <!-- ---- ABA: PEDIDOS ---- -->
    <section class="section active" id="tab-pedidos" role="tabpanel">

      <!-- Hino do Dia -->
      <div id="hino-container"></div>

      <!-- Orador do Dia -->
      <div id="orador-container"></div>

      <!-- Pedidos -->
      <div class="secao-titulo">🛐 Pedidos e Agradecimentos</div>
      <div id="pedidos-container"></div>

    </section>

    <!-- ---- ABA: MOTIVOS GERAIS ---- -->
    <section class="section" id="tab-motivos" role="tabpanel">
      <div class="secao-titulo" style="margin-top:8px">🛐 Motivos Gerais de Oração</div>
      <div class="motivos-grid" id="motivos-container"></div>
    </section>

    <!-- ---- ABA: LISTA ---- -->
    <section class="section" id="tab-lista" role="tabpanel">
      <div class="secao-titulo" style="margin-top:8px">👥 Lista de Intercedidos</div>
      <input
        class="lista-busca"
        type="search"
        id="lista-busca"
        placeholder="🔍 Buscar nome..."
        aria-label="Buscar na lista"
      />
      <div class="lista-contador" id="lista-contador"></div>
      <div id="lista-container"></div>
    </section>

    <!-- ---- ABA: MENSAGEM WHATSAPP ---- -->
    <section class="section" id="tab-mensagem" role="tabpanel">
      <div class="secao-titulo" style="margin-top:8px">📲 Mensagem para WhatsApp</div>

      <div class="card whatsapp-card">
        <div class="card-header">
          <span style="font-size:1.4rem">💬</span>
          <div>
            <div style="font-weight:700;color:#075E54">Mensagem do Dia</div>
            <div style="font-size:0.78rem;color:var(--texto-suave)">Pronta para enviar no WhatsApp</div>
          </div>
        </div>
        <div class="card-body">
          <div class="whatsapp-preview" id="wpp-preview"></div>
          <button class="btn-wpp" id="btn-wpp-enviar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Enviar no WhatsApp
          </button>
          <button class="btn-copiar" id="btn-copiar">
            📋 Copiar Mensagem Resumida
          </button>
          <button class="btn-copiar" id="btn-copiar-completa" style="background:#4A2A8A">
            📄 Copiar Mensagem Completa
          </button>
        </div>
      </div>

      <div class="admin-card mt-16">
        <div style="font-size:0.85rem;color:var(--texto-suave);text-align:center;line-height:1.6">
          🔗 <strong>Link do site:</strong><br>
          <a id="link-site-display" href="#" target="_blank" style="color:var(--roxo);word-break:break-all"></a>
          <br><br>
          <button class="btn-copiar" id="btn-copiar-link">
            🔗 Copiar Link do Site
          </button>
        </div>
      </div>

    </section>

    <!-- Rodapé -->
    <div class="rodape-hero">
      <div style="font-size:1.5rem">🌹</div>
      <strong id="rodape-texto">Deus te abençoe</strong>
      <p id="rodape-versic" style="font-size:0.78rem;opacity:0.8;margin-top:10px;font-style:italic"></p>
    </div>

  </main>

  <!-- ======================================================
       FAB — BOTÃO ADMIN
  ====================================================== -->
  <a href="admin.html"
     style="
       position:fixed;bottom:80px;right:20px;
       background:var(--roxo-dark);color:#fff;
       width:48px;height:48px;border-radius:50%;
       display:flex;align-items:center;justify-content:center;
       font-size:1.3rem;box-shadow:0 4px 16px rgba(0,0,0,0.3);
       text-decoration:none;z-index:200;
     "
     title="Administração"
     aria-label="Ir para administração"
  >⚙️</a>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <!-- env-config.js é gerado pelo build-env.js no deploy do Netlify.
       Define window.ENV_CONFIG com JSONBIN_BIN_ID e JSONBIN_API_KEY.
       Deve ser carregado ANTES de db.js. -->
  <script src="env-config.js" onerror="window.ENV_CONFIG=window.ENV_CONFIG||{}"></script>
  <script src="data.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
